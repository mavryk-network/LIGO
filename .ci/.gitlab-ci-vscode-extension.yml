## LSP and Debugger

include:
  - '/.ci/.gitlab-ci-tools-common.yml'

variables:
  # MAVRYK: mavryk-packaging dropped the "mavkit-" tag prefix, and the "-1" release (v20.4-1) ships no
  # mavkit-client asset — the old "mavkit-v20.4" → tag "mavkit-v20.4-1" 404s. v20.3 is the latest release
  # that publishes mavkit-client; paired with the Dockerfile using ${MAVKIT_VERSION} directly (no "-1").
  MAVKIT_VERSION: "v20.3"

vscode-extension-test:
  extends: .docker-image
  stage: tools-check
  tags:
    - ubuntu-amd64
  rules: &vscode_extension_mr_dev
    - !reference [.vscode_extension_mr_changes]
    - !reference [.dev]
  needs: [docker_extract, debugger-build]
  # MAVRYK: auto-retry transient infra flakes during image build (apt mirror resets, VSCode/chromedriver downloads).
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure
      - script_failure
  script:
    - docker build --build-arg MAVKIT_VERSION="$MAVKIT_VERSION" -f tools/vscode/Dockerfile -t lsp-vscode-test:$CI_JOB_ID .
    - docker run --rm --init --user vscode lsp-vscode-test:$CI_JOB_ID xvfb-run bash -c 'yarn && yarn run package && yarn run test'
  after_script:
    - docker image rm lsp-vscode-test:$CI_JOB_ID

vscode-extension-extest:
  extends: .docker-image
  stage: tools-check
  tags:
    - ubuntu-amd64
  rules: *vscode_extension_mr_dev
  needs: [docker_extract, debugger-build]
  # MAVRYK: auto-retry transient infra flakes during image build (apt mirror resets, VSCode/chromedriver downloads).
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure
      - script_failure
  script:
    - docker build --build-arg MAVKIT_VERSION="$MAVKIT_VERSION" -f tools/vscode/Dockerfile -t lsp-vscode-test:$CI_JOB_ID .
    - docker run --rm --init --user vscode lsp-vscode-test:$CI_JOB_ID xvfb-run bash -c 'yarn && yarn run package && yarn run extest'
  after_script:
    - docker image rm lsp-vscode-test:$CI_JOB_ID

vscode-extension-extest-deploy:
  extends: .docker-image
  stage: tools-check
  tags:
    - ubuntu-amd64
  rules: *vscode_extension_mr_dev
  needs: [docker_extract, debugger-build]
  script:
    - docker build --build-arg MAVKIT_VERSION="$MAVKIT_VERSION" -f tools/vscode/Dockerfile -t lsp-vscode-test:$CI_JOB_ID .
    - docker run --rm --init --user vscode lsp-vscode-test:$CI_JOB_ID xvfb-run bash -c 'yarn && yarn run package && yarn run extest-deploy'
  after_script:
    - docker image rm lsp-vscode-test:$CI_JOB_ID
  allow_failure: true

emacs-lsp-client-test:
  stage: tools-check
  tags:
    - ubuntu-amd64
  image: silex/emacs:29.1-ci-cask
  variables:
    EMACS: "emacs-29.1"
  rules:
    - !reference [.dev]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
      - tools/emacs/**/*
  needs: [docker_extract]
  script:
    # Add ligo to path
    - export PATH=$PWD:$PATH
    - cd tools/emacs
    - cask install
    - cask emacs --batch -L . -l tests/configuration-test.el -f ert-run-tests-batch

vscode-extension:
  stage: tooling
  rules:
    - !reference [.vscode_extension_mr_changes]
    - !reference [.dev]
    - !reference [.vscode_production]
  needs: [debugger-build]
  # needs: [debugger-build, debugger-build-macos]
  tags:
    - ubuntu-amd64
  image: node:18.19.1-bullseye
  script:
    - mkdir -p tools/vscode/bin
    - cp -r Linux tools/vscode/bin
    # MAVRYK: PascaLIGO. The macOS artifact (debugger-build-macos) is not in `needs` (commented out
    # above), so the Darwin dir may be absent — guard the copy so the job packages a Linux-only .vsix
    # instead of failing. Restores/covers automatically if debugger-build-macos is re-enabled.
    - '[ -d Darwin ] && cp -r Darwin tools/vscode/bin || echo "Darwin artifact absent (macOS build disabled); packaging without it"'
    - cd tools/vscode
    - mv ligo-debugger-platform-dispatcher.sh bin/ligo-debugger
    - make package
  artifacts:
    paths:
      - ./tools/vscode/*.vsix

vscode-extension-publish:
  stage: push
  rules:
    - !reference [.vscode_production]
  needs: [vscode-extension]
  tags:
    - ubuntu-amd64
  image: node:18.19.1-bullseye
  when: manual
  script:
    - yarn global add @vscode/vsce ovsx
    - vsce publish --packagePath ./tools/vscode/*.vsix # Uses VSCE_PAT env variable as personal access token
    - ovsx publish ./tools/vscode/*.vsix # Uses OVSX_PAT env variable as personal access token
